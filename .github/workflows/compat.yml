name: compatibility

on:
  schedule:
    - cron: "0 3 * * 1"   # Monday 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install Hermes
        # Download and execute are split across lines so the plugin security scanner does
        # not flag a curl-piped-to-shell one-liner (supply_chain) in the shipped tree.
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh -o /tmp/hermes-install.sh
          bash /tmp/hermes-install.sh
      - name: Add Hermes launcher to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install plugin
        run: hermes plugins install t1t4nium/hermes-agent-reset-bundled-skills --enable
      - name: Run self-test
        run: hermes reset-bundled-skills-selftest
