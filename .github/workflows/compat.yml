name: compatibility

on:
  schedule:
    - cron: "0 3 * * 1"   # Monday 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install Hermes
        run: curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
      - name: Add Hermes launcher to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install plugin (README method)
        run: hermes plugins install t1t4nium/hermes-agent-reset-bundled-skills --enable
      - name: Run self-test
        run: hermes reset-bundled-skills-selftest
